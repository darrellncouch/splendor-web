<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Booty</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1418" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800;900&family=Pirata+One&display=swap" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Night-sea painting behind every phone screen. It lives here rather than in styles.scss so
      the relative URL resolves against the page (works under a GitHub Pages sub-path) instead of
      being rewritten by the build. A fixed layer is used because iOS ignores background-attachment: fixed.
    -->
    <style>
      body::before {
        content: '';
        position: fixed;
        inset: 0;
        z-index: -1;
        background:
          radial-gradient(ellipse at 50% 40%, rgba(8, 10, 12, .25), rgba(8, 10, 12, .8) 95%),
          linear-gradient(180deg, rgba(8, 10, 12, .5), transparent 20%),
          url('art/night-sea.jpg') 42% center / cover no-repeat,
          #0d1418;
      }
    </style>
  </head>
  <body>
    <sp-root></sp-root>
  </body>
</html>
